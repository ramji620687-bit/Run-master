name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          mkdir -p proj/app/src/main/java/com/runmaster/app proj/app/src/main/res/values
          cp build.gradle settings.gradle gradle.properties proj/
          cp app-build.gradle proj/app/build.gradle
          cp AndroidManifest*.xml proj/app/src/main/AndroidManifest.xml
          cp styles.xml proj/app/src/main/res/values/
          cp MainActivity.kt proj/app/src/main/java/com/runmaster/app/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RunMaster-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
